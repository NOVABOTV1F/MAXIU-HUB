<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAXIU KEY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #e0f7ff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== LANGIT: bintang + bulan + petir ===== */
        .sky {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, #0a1628 0%, #000 70%);
            overflow: hidden;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #b3e5fc;
            border-radius: 50%;
            box-shadow: 0 0 4px #81d4fa;
            animation: twinkle var(--d) ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); }
        }
        .moon {
            position: absolute;
            top: 8%;
            right: 12%;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #e0f7ff, #81d4fa 60%, #4fc3f7);
            box-shadow: 0 0 30px rgba(129, 212, 250, 0.5), 0 0 60px rgba(79, 195, 247, 0.25);
            animation: moonGlow 4s ease-in-out infinite;
        }
        .moon::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 14px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #000;
            opacity: 0.15;
        }
        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(129,212,250,0.5), 0 0 60px rgba(79,195,247,0.25); }
            50% { box-shadow: 0 0 40px rgba(129,212,250,0.8), 0 0 80px rgba(79,195,247,0.4); }
        }
        .lightning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            opacity: 0;
            pointer-events: none;
            animation: flash 7s ease-in-out infinite;
        }
        .lightning::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 30%;
            width: 3px;
            height: 35%;
            background: linear-gradient(to bottom, #e0f7ff, #4fc3f7, transparent);
            clip-path: polygon(40% 0%, 60% 0%, 45% 40%, 70% 40%, 30% 100%, 40% 50%, 20% 50%);
            filter: drop-shadow(0 0 8px #81d4fa);
        }
        .lightning::after {
            content: '';
            position: absolute;
            top: 10%;
            right: 25%;
            width: 2px;
            height: 28%;
            background: linear-gradient(to bottom, #e0f7ff, #4fc3f7, transparent);
            clip-path: polygon(50% 0%, 65% 0%, 40% 45%, 65% 45%, 25% 100%, 35% 55%, 15% 55%);
            filter: drop-shadow(0 0 6px #81d4fa);
            opacity: 0.7;
        }
        @keyframes flash {
            0%, 88%, 100% { opacity: 0; }
            89% { opacity: 0.9; }
            90% { opacity: 0.15; }
            91% { opacity: 1; }
            93% { opacity: 0; }
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .screen.active { display: flex; }

        /* ===== SCREEN 1 ===== */
        #screen1 { justify-content: center; }
        .video-box {
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.25);
            border: 1px solid rgba(79, 195, 247, 0.3);
            background: #000;
            margin-bottom: 28px;
        }
        .video-box video { width: 100%; height: auto; display: block; }
        .btn-maxiu {
            width: 100%;
            max-width: 420px;
            padding: 18px 24px;
            background: linear-gradient(135deg, #0277bd, #4fc3f7);
            border: none;
            color: #000;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(79, 195, 247, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-maxiu:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 36px rgba(129, 212, 250, 0.6);
        }
        .hint {
            margin-top: 14px;
            font-size: 13px;
            color: #81d4fa;
            text-align: center;
        }

        /* ===== SCREEN 2 ===== */
        #screen2 { justify-content: flex-start; padding-top: 24px; padding-bottom: 40px; }
        .page-title {
            font-size: 24px;
            font-weight: 800;
            color: #4fc3f7;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.6);
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: 2px;
        }
        .page-sub {
            color: #81d4fa;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;
            opacity: 0.85;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(5, 15, 25, 0.85);
            border: 1px solid rgba(79, 195, 247, 0.35);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.08);
        }
        .card h3 {
            font-size: 15px;
            color: #4fc3f7;
            margin-bottom: 14px;
        }

        .missions { display: flex; gap: 10px; margin-bottom: 16px; }
        .mission-step {
            flex: 1;
            text-align: center;
            padding: 12px 6px;
            border-radius: 10px;
            border: 2px solid #1a2a3a;
            background: rgba(0,0,0,0.4);
            font-size: 13px;
            font-weight: 700;
            color: #555;
        }
        .mission-step.done {
            border-color: #4fc3f7;
            color: #4fc3f7;
            background: rgba(79, 195, 247, 0.12);
            box-shadow: 0 0 12px rgba(79, 195, 247, 0.25);
        }
        .mission-step.active {
            border-color: #81d4fa;
            color: #81d4fa;
            background: rgba(129, 212, 250, 0.08);
            animation: pulseBorder 1.5s ease-in-out infinite;
        }
        @keyframes pulseBorder {
            0%, 100% { box-shadow: 0 0 6px rgba(129,212,250,0.2); }
            50% { box-shadow: 0 0 16px rgba(129,212,250,0.5); }
        }

        .btn-lv {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 2px solid #4fc3f7;
            color: #4fc3f7;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-lv:hover:not(:disabled) {
            background: rgba(79, 195, 247, 0.15);
            box-shadow: 0 0 16px rgba(79, 195, 247, 0.3);
        }
        .btn-lv:disabled { opacity: 0.35; cursor: not-allowed; }

        .cooldown-msg {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            color: #81d4fa;
            display: none;
        }
        .cooldown-msg.show { display: block; }

        .video-mini {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            margin-bottom: 14px;
            border: 1px solid rgba(79, 195, 247, 0.2);
        }
        .video-mini video {
            width: 100%;
            height: auto;
            display: block;
            max-height: 180px;
            object-fit: cover;
        }

        .key-display {
            text-align: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(79, 195, 247, 0.2);
            margin-bottom: 14px;
        }
        .key-label { font-size: 12px; color: #81d4fa; margin-bottom: 6px; opacity: 0.8; }
        .key-value {
            font-family: 'Courier New', monospace;
            font-size: 17px;
            font-weight: 800;
            color: #4fc3f7;
            letter-spacing: 0.5px;
            word-break: break-all;
            text-shadow: 0 0 10px rgba(79, 195, 247, 0.4);
        }
        .key-value.empty { color: #444; font-size: 14px; font-weight: 500; text-shadow: none; }
        .key-meta {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-ok { background: rgba(79,195,247,0.15); color: #4fc3f7; border: 1px solid #4fc3f7; }
        .badge-no { background: rgba(100,100,100,0.2); color: #888; border: 1px solid #555; }
        .badge-time { background: rgba(129,212,250,0.1); color: #81d4fa; border: 1px solid #0277bd; }

        /* Dua tombol berdampingan */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 4px;
        }
        .btn-row button {
            flex: 1;
            padding: 14px 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-addkey {
            background: linear-gradient(135deg, #01579b, #4fc3f7);
            color: #000;
            box-shadow: 0 0 14px rgba(79, 195, 247, 0.3);
        }
        .btn-addkey:hover:not(:disabled) {
            box-shadow: 0 0 22px rgba(129, 212, 250, 0.5);
        }
        .btn-addtime {
            background: transparent;
            border: 2px solid #4fc3f7 !important;
            color: #4fc3f7;
        }
        .btn-addtime:hover:not(:disabled) {
            background: rgba(79, 195, 247, 0.12);
            box-shadow: 0 0 14px rgba(79, 195, 247, 0.25);
        }
        .btn-row button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: none;
        }
        .key-count {
            text-align: center;
            font-size: 12px;
            color: #81d4fa;
            margin-top: 8px;
            opacity: 0.75;
        }

        .success-msg {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
            color: #4fc3f7;
            display: none;
            font-weight: 600;
        }
        .success-msg.show { display: block; }

        .btn-back {
            margin-top: 8px;
            background: transparent;
            border: 1px solid #1a2a3a;
            color: #81d4fa;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            opacity: 0.7;
        }
        .btn-back:hover { opacity: 1; border-color: #4fc3f7; }

        /* Fingerprint */
        .fp-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }
        .fp-overlay.show { display: flex; }
        .fp-box { text-align: center; }
        .fp-ring {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 18px;
        }
        .fp-ring svg {
            width: 140px;
            height: 140px;
            transform: rotate(-90deg);
        }
        .fp-track { fill: none; stroke: rgba(79,195,247,0.2); stroke-width: 8; }
        .fp-progress {
            fill: none;
            stroke: #4fc3f7;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 339.3;
            stroke-dashoffset: 339.3;
            filter: drop-shadow(0 0 8px #4fc3f7);
        }
        .fp-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .fp-text { font-size: 17px; font-weight: 700; margin-bottom: 4px; color: #e0f7ff; }
        .fp-sub { font-size: 13px; color: #4fc3f7; }

        @media (max-width: 480px) {
            .btn-maxiu { font-size: 18px; padding: 16px; }
            .key-value { font-size: 15px; }
            .btn-row button { font-size: 12px; padding: 12px 8px; }
        }
    </style>
</head>
<body>
    <!-- Langit malam -->
    <div class="sky" id="sky">
        <div class="moon"></div>
        <div class="lightning"></div>
    </div>

    <!-- SCREEN 1 -->
    <div id="screen1" class="screen active">
        <div class="video-box">
            <video id="video1" autoplay loop muted playsinline webkit-playsinline>
                <source src="https://raw.githubusercontent.com/NOVABOTV1F/BOT_KEY_WEB/main/tiktokio.com1791268330_39vUti4Rh3XA5sskjclN.mp4" type="video/mp4">
            </video>
        </div>
        <button class="btn-maxiu" onclick="goToMission()">GET KEY MAXIU</button>
        <p class="hint">Klik tombol untuk mulai misi &amp; dapat key</p>
    </div>

    <!-- SCREEN 2 -->
    <div id="screen2" class="screen">
        <div class="page-title">⚡ MAXIU KEY</div>
        <div class="page-sub">Selesaikan misi → dapat key 24 jam</div>

        <div class="card">
            <h3>📢 Sponsor — Selesaikan Misi</h3>
            <div class="missions">
                <div class="mission-step" id="m1">1</div>
                <div class="mission-step" id="m2">2</div>
                <div class="mission-step" id="m3">3</div>
            </div>
            <button class="btn-lv" id="btnLv" onclick="openLinkvertise()">Open Linkvertise</button>
            <div class="cooldown-msg" id="cooldownMsg"></div>
        </div>

        <div class="card">
            <div class="video-mini">
                <video id="video2" autoplay loop muted playsinline webkit-playsinline>
                    <source src="https://raw.githubusercontent.com/NOVABOTV1F/BOT_KEY_WEB/main/tiktokio.com1791268269_38PsfLpJNEF2VsxL3iAm.mp4" type="video/mp4">
                </video>
            </div>

            <div class="key-display">
                <div class="key-label">Key Aktif</div>
                <div class="key-value empty" id="keyValue">Belum ada key</div>
                <div class="key-meta">
                    <span class="badge badge-no" id="keyBadge">EXPIRED</span>
                    <span class="badge badge-time" id="keyTime">—</span>
                </div>
            </div>

            <!-- Dua tombol: ADD KEY + TAMBAH WAKTU -->
            <div class="btn-row">
                <button class="btn-addkey" id="btnAddKey" onclick="startFingerprint('new')" disabled>ADD KEY</button>
                <button class="btn-addtime" id="btnAddTime" onclick="startFingerprint('time')" disabled>TAMBAH WAKTU</button>
            </div>
            <div class="key-count" id="keyCount">Key: 0 / 5 per HP</div>
            <div class="success-msg" id="successMsg"></div>
        </div>

        <button class="btn-back" onclick="goHome()">← Kembali</button>
    </div>

    <!-- Overlay sidik jari -->
    <div id="fpOverlay" class="fp-overlay">
        <div class="fp-box">
            <div class="fp-ring">
                <svg viewBox="0 0 120 120">
                    <circle class="fp-track" cx="60" cy="60" r="54"/>
                    <circle class="fp-progress" id="fpProgress" cx="60" cy="60" r="54"/>
                </svg>
                <div class="fp-icon">👆</div>
            </div>
            <div class="fp-text" id="fpText">Tekan sidik jari…</div>
            <div class="fp-sub">Tahan 5 detik</div>
        </div>
    </div>

    <script>
        /* Bintang acak */
        (function() {
            var sky = document.getElementById('sky');
            for (var i = 0; i < 60; i++) {
                var s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.setProperty('--d', (1.5 + Math.random() * 3) + 's');
                s.style.animationDelay = (Math.random() * 4) + 's';
                if (Math.random() > 0.7) {
                    s.style.width = '3px';
                    s.style.height = '3px';
                }
                sky.appendChild(s);
            }
        })();

        /* ===== CONFIG ===== */
        var LINKVERTISE_SLOTS = [
            'https://direct-link.net/8764237/eHlx6UB5eaT0',
            'https://link-hub.net/8764237/V9KtsIR6Zkmi'
        ];
        var KEY_MS = 24 * 60 * 60 * 1000;
        var COOLDOWN_MS = 60 * 1000;
        var MIN_MISSION_SEC = 20;
        var MAX_KEYS = 5;
        var mission = parseInt(localStorage.getItem('mMission') || '0', 10);
        var lastClaim = parseInt(localStorage.getItem('mLastClaim') || '0', 10);
        var mediaOn = false;
        var fpBusy = false;
        var pendingOpen = false;
        var pendingAt = 0;
        var claimMode = 'new'; // 'new' | 'time'

        function pool() {
            return LINKVERTISE_SLOTS.filter(function(u) {
                u = String(u || '').trim();
                return u.indexOf('http://') === 0 || u.indexOf('https://') === 0;
            });
        }
        function digits(n) {
            var s = '';
            for (var i = 0; i < n; i++) s += Math.floor(Math.random() * 10);
            return s;
        }
        function genKey() {
            return 'MAXIU_' + digits(4) + '_' + digits(4) + '_' + digits(4);
        }
        function getKeys() {
            try { return JSON.parse(localStorage.getItem('mKeys') || '[]'); }
            catch (e) { return []; }
        }
        function saveKeys(a) { localStorage.setItem('mKeys', JSON.stringify(a)); }
        function activeKey() {
            var now = Date.now(), best = null, keys = getKeys();
            for (var i = 0; i < keys.length; i++) {
                if (keys[i].expiresAt > now) {
                    if (!best || keys[i].expiresAt > best.expiresAt) best = keys[i];
                }
            }
            return best;
        }
        function remain(ms) {
            if (ms <= 0) return '0j 0m 0d';
            var s = Math.floor(ms / 1000);
            var h = Math.floor(s / 3600);
            var m = Math.floor((s % 3600) / 60);
            var d = s % 60;
            return h + 'j ' + m + 'm ' + d + 'd';
        }

        function goToMission() {
            startMedia();
            document.getElementById('screen1').classList.remove('active');
            document.getElementById('screen2').classList.add('active');
            syncVideo();
            refreshUI();
        }
        function goHome() {
            document.getElementById('screen2').classList.remove('active');
            document.getElementById('screen1').classList.add('active');
            syncVideo();
        }

        function startMedia() { mediaOn = true; syncVideo(); }
        function syncVideo() {
            var s1 = document.getElementById('screen1').classList.contains('active');
            var s2 = document.getElementById('screen2').classList.contains('active');
            document.querySelectorAll('video').forEach(function(v) {
                var isActive = (v.id === 'video1' && s1) || (v.id === 'video2' && s2);
                if (isActive) {
                    v.muted = !mediaOn;
                    if (mediaOn) v.volume = 0.7;
                    if (v.paused) v.play().catch(function(){});
                } else {
                    v.muted = true;
                    v.pause();
                }
            });
        }
        document.addEventListener('click', startMedia);
        document.addEventListener('touchstart', startMedia, { passive: true });

        /* --- Linkvertise --- */
        function openLinkvertise() {
            var left = lastClaim + COOLDOWN_MS - Date.now();
            if (left > 0) { alert('Tunggu cooldown ' + Math.ceil(left / 1000) + ' detik.'); return; }
            if (mission >= 3) { alert('Misi sudah selesai. Pilih ADD KEY atau TAMBAH WAKTU.'); return; }
            if (pendingOpen) { alert('Selesaikan dulu misi yang sedang dibuka, lalu kembali ke halaman ini.'); return; }
            var p = pool();
            if (p.length === 0) { alert('Belum ada link Linkvertise.'); return; }
            var url = p[Math.floor(Math.random() * p.length)];
            var win = window.open(url, '_blank');
            if (!win) { alert('Popup diblokir. Izinkan popup lalu coba lagi.'); return; }
            pendingOpen = true;
            pendingAt = Date.now();
            refreshUI();
        }

        function tryCompleteMission() {
            if (!pendingOpen) return;
            var elapsed = (Date.now() - pendingAt) / 1000;
            if (elapsed < MIN_MISSION_SEC) {
                alert('Misi belum selesai!\nTunggu minimal ' + MIN_MISSION_SEC + ' detik di Linkvertise.\n(Sudah ' + Math.floor(elapsed) + 's / ' + MIN_MISSION_SEC + 's)');
                return;
            }
            pendingOpen = false;
            pendingAt = 0;
            mission = Math.min(3, mission + 1);
            localStorage.setItem('mMission', String(mission));
            refreshUI();
            if (mission >= 3) alert('✅ Misi 1, 2, 3 selesai!\nTekan ADD KEY atau TAMBAH WAKTU.');
            else alert('✅ Misi ' + mission + ' selesai! Lanjut Open Linkvertise.');
        }
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) { tryCompleteMission(); syncVideo(); }
        });
        window.addEventListener('focus', tryCompleteMission);

        /* --- Fingerprint --- */
        function startFingerprint(mode) {
            claimMode = mode || 'new';
            var left = lastClaim + COOLDOWN_MS - Date.now();
            if (left > 0) { alert('Tunggu cooldown ' + Math.ceil(left / 1000) + ' detik.'); return; }
            if (mission < 3) { alert('Selesaikan misi 1, 2, 3 dulu!'); return; }
            if (fpBusy) return;

            if (claimMode === 'new') {
                if (getKeys().length >= MAX_KEYS) {
                    alert('Limit ' + MAX_KEYS + ' key per HP sudah penuh.\nPakai TAMBAH WAKTU di key aktif.');
                    return;
                }
            } else {
                if (!activeKey()) {
                    alert('Belum ada key aktif. Buat key dulu lewat ADD KEY.');
                    return;
                }
            }

            fpBusy = true;
            var overlay = document.getElementById('fpOverlay');
            var bar = document.getElementById('fpProgress');
            var txt = document.getElementById('fpText');
            var circ = 2 * Math.PI * 54;
            overlay.classList.add('show');
            txt.textContent = 'Tekan sidik jari…';
            bar.style.strokeDasharray = String(circ);
            bar.style.strokeDashoffset = String(circ);
            var t0 = Date.now();
            var iv = setInterval(function() {
                var pct = Math.min(1, (Date.now() - t0) / 5000);
                bar.style.strokeDashoffset = String(circ * (1 - pct));
                txt.textContent = 'Memverifikasi… ' + Math.ceil(5 - (Date.now() - t0) / 1000) + 's';
                if (pct >= 1) {
                    clearInterval(iv);
                    txt.textContent = '✅ Berhasil!';
                    setTimeout(function() {
                        overlay.classList.remove('show');
                        fpBusy = false;
                        addKey();
                    }, 500);
                }
            }, 40);
        }

        function addKey() {
            var keys = getKeys();
            var act = activeKey();
            var now = Date.now();
            var msg = document.getElementById('successMsg');

            if (claimMode === 'time' && act) {
                act.expiresAt += KEY_MS;
                for (var i = 0; i < keys.length; i++) {
                    if (keys[i].key === act.key) keys[i].expiresAt = act.expiresAt;
                }
                saveKeys(keys);
                msg.textContent = '✅ +24 jam! ' + act.key;
            } else if (claimMode === 'new') {
                if (keys.length >= MAX_KEYS) {
                    msg.textContent = '❌ Limit ' + MAX_KEYS + ' key/HP tercapai.';
                    msg.classList.add('show');
                    mission = 0; lastClaim = now;
                    localStorage.setItem('mMission', '0');
                    localStorage.setItem('mLastClaim', String(now));
                    refreshUI();
                    return;
                }
                var k = genKey();
                keys.push({ key: k, createdAt: now, expiresAt: now + KEY_MS });
                saveKeys(keys);
                msg.textContent = '✅ Key baru: ' + k + ' · ' + keys.length + '/' + MAX_KEYS;
            } else {
                msg.textContent = '❌ Tidak ada key aktif untuk ditambah waktu.';
            }
            msg.classList.add('show');
            mission = 0;
            lastClaim = now;
            localStorage.setItem('mMission', '0');
            localStorage.setItem('mLastClaim', String(now));
            refreshUI();
        }

        function refreshUI() {
            var now = Date.now();
            var coolLeft = lastClaim + COOLDOWN_MS - now;
            var onCool = coolLeft > 0;
            var act = activeKey();
            var keyCount = getKeys().length;

            for (var i = 1; i <= 3; i++) {
                var el = document.getElementById('m' + i);
                el.className = 'mission-step';
                if (i <= mission) el.classList.add('done');
                else if (i === mission + 1 && !onCool && !pendingOpen) el.classList.add('active');
            }

            var btnLv = document.getElementById('btnLv');
            var btnAdd = document.getElementById('btnAddKey');
            var btnTime = document.getElementById('btnAddTime');
            var coolMsg = document.getElementById('cooldownMsg');
            var kc = document.getElementById('keyCount');

            if (btnLv) {
                btnLv.disabled = onCool || mission >= 3 || pendingOpen;
                if (onCool) btnLv.textContent = 'Open Linkvertise (cooldown)';
                else if (pendingOpen) {
                    var wait = Math.max(0, MIN_MISSION_SEC - Math.floor((Date.now() - pendingAt) / 1000));
                    btnLv.textContent = wait > 0 ? 'Selesaikan misi… (' + wait + 's)' : 'Kembali ke sini untuk validasi';
                }
                else if (mission >= 3) btnLv.textContent = 'Misi selesai ✓';
                else btnLv.textContent = 'Open Linkvertise';
            }

            // ADD KEY: misi selesai + belum full + bukan cooldown
            if (btnAdd) {
                btnAdd.disabled = onCool || mission < 3 || fpBusy || pendingOpen || keyCount >= MAX_KEYS;
                btnAdd.textContent = keyCount >= MAX_KEYS ? 'LIMIT 5 KEY' : 'ADD KEY';
            }
            // TAMBAH WAKTU: misi selesai + ada key aktif
            if (btnTime) {
                btnTime.disabled = onCool || mission < 3 || fpBusy || pendingOpen || !act;
                btnTime.textContent = act ? 'TAMBAH WAKTU' : 'TAMBAH WAKTU';
            }
            if (kc) kc.textContent = 'Key: ' + keyCount + ' / ' + MAX_KEYS + ' per HP';

            if (coolMsg) {
                if (onCool) {
                    coolMsg.classList.add('show');
                    coolMsg.textContent = '⏳ Cooldown: ' + Math.ceil(coolLeft / 1000) + 's';
                } else if (pendingOpen) {
                    coolMsg.classList.add('show');
                    var leftSec = Math.max(0, MIN_MISSION_SEC - Math.floor((Date.now() - pendingAt) / 1000));
                    coolMsg.textContent = leftSec > 0
                        ? '⏳ Selesaikan misi (min ' + leftSec + 's), lalu kembali'
                        : '✅ Kembali ke tab ini untuk validasi';
                } else {
                    coolMsg.classList.remove('show');
                }
            }

            var kv = document.getElementById('keyValue');
            var kb = document.getElementById('keyBadge');
            var kt = document.getElementById('keyTime');
            if (act) {
                kv.textContent = act.key;
                kv.classList.remove('empty');
                kb.textContent = 'ASLI';
                kb.className = 'badge badge-ok';
                kt.textContent = 'Sisa ' + remain(act.expiresAt - now);
            } else {
                kv.textContent = 'Belum ada key / EXPIRED';
                kv.classList.add('empty');
                kb.textContent = 'EXPIRED';
                kb.className = 'badge badge-no';
                kt.textContent = 'Tidak bisa dipakai';
            }
        }

        setInterval(refreshUI, 1000);
        window.addEventListener('load', function() {
            document.querySelectorAll('video').forEach(function(v) {
                v.muted = true;
                v.play().catch(function(){});
            });
            refreshUI();
        });
    </script>
</body>
</html>
